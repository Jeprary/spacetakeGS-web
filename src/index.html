<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#070a0a" />
    <meta
      name="description"
      content="Capture a space. Keep it yours."
    />
    <meta property="og:title" content="SpaceTake GS" />
    <meta
      property="og:description"
      content="Capture a space. Keep it yours."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://jeprary.github.io/spacetakeGS-web/" />
    <meta property="og:image" content="https://jeprary.github.io/spacetakeGS-web/share-card-v2.png" />
    <meta property="og:image:secure_url" content="https://jeprary.github.io/spacetakeGS-web/share-card-v2.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:alt" content="SpaceTake GS circular brand mark" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SpaceTake GS" />
    <meta
      name="twitter:description"
      content="Capture a space. Keep it yours."
    />
    <meta name="twitter:image" content="https://jeprary.github.io/spacetakeGS-web/share-card-v2.png" />
    <meta name="twitter:image:alt" content="SpaceTake GS circular brand mark" />
    <link rel="icon" href="./brand-mark.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" sizes="180x180" />
    <link rel="canonical" href="https://jeprary.github.io/spacetakeGS-web/" />
    <link rel="manifest" href="./site.webmanifest" />
    <link
      rel="preload"
      href="./assets/x5-tunnel-mrnf-ppisp-sh3-4m97-aligned.sog"
      as="fetch"
      type="application/octet-stream"
      crossorigin="anonymous"
    />
    <title>SpaceTake GS</title>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>

    <header class="site-header" data-header>
      <a class="brand" href="#top" aria-label="SpaceTake GS home">
        <img class="brand-mark" src="./brand-mark.svg" alt="" width="18" height="18" />
        <span>SpaceTake <b>GS</b></span>
      </a>
    </header>

    <main id="main">
      <section id="top" class="hero" aria-labelledby="hero-title">
        <div class="hero-content section-shell">
          <h1 id="hero-title">
            <span class="hero-line">Capture a space</span>
            <em class="hero-line">Keep it yours</em>
          </h1>
          <p class="hero-lede">
            Turn panoramic capture into an inspectable Gaussian scene — processed locally
            on your own machine.
          </p>
        </div>
      </section>

      <section
        class="reveal-section"
        data-reveal-section
      >
        <div class="reveal-sticky">
          <div class="reveal-clipper">
            <div class="reveal-media">
              <img
                data-reveal-image
                src="./reconstruction-preview.jpg"
                alt="Preview of a reconstructed indoor corridor with brick walls and murals"
              />
            </div>
          </div>
          <div class="reveal-copy section-shell">
            <p class="eyebrow"><span></span> SCENE PREVIEW</p>
            <h2>A captured space, rebuilt in 3D</h2>
          </div>
        </div>
      </section>

      <section id="viewer" class="viewer-section" aria-labelledby="viewer-title">
        <div class="section-shell">
          <div class="viewer-intro">
            <h2 id="viewer-title">Move through the captured space</h2>
          </div>
          <div class="viewer-shell" data-viewer-shell aria-labelledby="viewer-title">
            <div class="viewer-stage" data-viewer-stage aria-busy="true"></div>
            <p class="sr-only" data-viewer-status aria-live="polite" aria-atomic="true"></p>
          </div>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <p class="footer-author">Created by Jeprary</p>
    </footer>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
